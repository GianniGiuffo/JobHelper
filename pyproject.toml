[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-job-hunter"
version = "0.1.0"
description = "Adattatori interni per AI Job Hunter, orchestrato da n8n"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.152.0", "uvicorn==0.54.0", "httpx==0.28.1",
  "pydantic==2.14.1", "pypdf==6.21.1", "python-multipart==0.0.32",
  "beautifulsoup4==4.15.0"
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "PyYAML==6.0.3"]

[tool.setuptools.packages.find]
include = ["job_hunter*"]

[tool.setuptools.data-files]
"share/ai-job-hunter/prompts" = ["prompts/*.md"]
"share/ai-job-hunter/config" = ["config/search-vocabulary.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
