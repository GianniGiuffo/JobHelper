name: ai-job-hunter
services:
  hunter:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      HUNTER_API_TOKEN_FILE: /run/secrets/hunter_api_token
      CRAWL4AI_API_TOKEN_FILE: /run/secrets/crawl_api_token
    secrets: [hunter_api_token, crawl_api_token]
    volumes:
      - hunter_data:/data
    extra_hosts:
      - host.docker.internal:host-gateway
    networks: [hunter]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 100
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  searxng:
    image: searxng/searxng:2026.10.19-81371861f@sha256:5ed0323b5f5f8701264ef65e239a2bd83cb57098f2b971fa30bf79c06eeae271
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Eseguire python scripts/setup.py}
      FORCE_OWNERSHIP: "false"
    volumes:
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks: [hunter]
    mem_limit: 512m
    cpus: 0.75
  crawl4ai:
    image: unclecode/crawl4ai:0.9.5@sha256:0b05666882bfb67f45d559a5b827839c54127b74aedd723f8ab338a3571b5fc9
    restart: unless-stopped
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:?Eseguire python scripts/setup.py}
    networks: [hunter]
    shm_size: 256m
    mem_limit: 1536m
    cpus: 1.0
    pids_limit: 256
    security_opt: [no-new-privileges:true]
volumes:
  hunter_data:
secrets:
  hunter_api_token:
    file: ./secrets/hunter_api_token
  crawl_api_token:
    file: ./secrets/crawl_api_token
networks:
  hunter:
