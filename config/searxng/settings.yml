use_default_settings: true
general:
  debug: false
  instance_name: AI Job Hunter private
search:
  safe_search: 1
  formats:
    - html
    - json
server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false
  # Overridden by SEARXNG_SECRET, generated locally; never deploy this placeholder.
  secret_key: configure-with-SEARXNG_SECRET
outgoing:
  request_timeout: 8.0
  max_request_timeout: 15.0
